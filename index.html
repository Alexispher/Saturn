<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isomium - Saturn Photo Mode</title>

  <!-- Biblioteca para capturar elementos HTML/CSS como imagem -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --accent: #ffffff;

      /* Variáveis controladas pelo Modo Foto */
      --light-pos-x: 32%;
      --light-pos-y: 32%;
      --planet-rot: -13deg;
      --pm-contrast: 1.12;
      --pm-brightness: 0.58;

      --stage-width: 658.2px;
      --stage-height: 759.99px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.035), transparent 34%),
        #000;
      position: relative;
    }

    .capture-stage {
      width: var(--stage-width);
      height: var(--stage-height);
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.85;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.65) 0 1px, transparent 1.7px),
        radial-gradient(circle, rgba(255,255,255,0.45) 0 1px, transparent 1.8px);
      background-size: 120px 120px, 180px 180px, 260px 260px;
      background-position: 12px 34px, 74px 96px, 120px 40px;
      animation: starDrift 28s linear infinite;
    }

    @keyframes starDrift {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(-60px, 40px, 0);
      }
    }

    #saturn {
      width: 520px;
      height: 520px;
      position: relative;
      transform: rotateZ(var(--planet-rot));
      filter: grayscale(1) contrast(var(--pm-contrast)) brightness(var(--pm-brightness));
      transition:
        transform 0.05s linear,
        filter 0.05s linear;
    }

    .planet {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      box-shadow:
        inset -34px -38px 70px rgba(0,0,0,0.82),
        inset 18px 16px 32px rgba(255,255,255,0.16),
        0 0 52px rgba(255,255,255,0.08);
    }

    .planet-bg {
      background:
        radial-gradient(
          circle at var(--light-pos-x) var(--light-pos-y),
          rgba(255,255,255,0.90) 0%,
          rgba(225,225,225,0.70) 14%,
          rgba(135,135,135,0.55) 34%,
          rgba(58,58,58,0.90) 62%,
          rgba(0,0,0,1) 100%
        );
    }

    .planet::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        linear-gradient(
          to bottom,
          transparent 0%,
          rgba(255,255,255,0.10) 22%,
          transparent 26%,
          rgba(255,255,255,0.07) 38%,
          transparent 42%,
          rgba(0,0,0,0.24) 68%,
          transparent 74%
        );
      mix-blend-mode: screen;
      opacity: 0.45;
      pointer-events: none;
    }

    .planet.bottom {
      z-index: 1;
    }

    .planet.top {
      z-index: 5;
      clip-path: inset(0 0 50% 0);
    }

    .rings {
      width: 500px;
      height: 170px;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotateX(68deg);
      z-index: 3;
      background:
        radial-gradient(
          ellipse at center,
          transparent 0%,
          transparent 33%,
          rgba(255,255,255,0.90) 34%,
          rgba(180,180,180,0.70) 38%,
          transparent 39%,
          transparent 43%,
          rgba(255,255,255,0.76) 44%,
          rgba(120,120,120,0.60) 50%,
          transparent 51%,
          transparent 56%,
          rgba(255,255,255,0.55) 57%,
          rgba(90,90,90,0.50) 64%,
          transparent 65%,
          transparent 100%
        );
      filter: blur(0.2px);
      box-shadow:
        0 0 18px rgba(255,255,255,0.08),
        inset 0 0 12px rgba(255,255,255,0.06);
    }

    .rings::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        linear-gradient(
          to right,
          rgba(0,0,0,0.72),
          transparent 24%,
          transparent 70%,
          rgba(255,255,255,0.18)
        );
      pointer-events: none;
    }

    .rings-shadow {
      width: 300px;
      height: 42px;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotateX(68deg);
      z-index: 4;
      background: rgba(0,0,0,0.45);
      filter: blur(10px);
      opacity: 0.65;
      pointer-events: none;
    }

    .glass_panel {
      background: rgba(14, 14, 16, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #photo-mode-ui {
      display: none;
      position: fixed;
      top: 80px;
      left: 20px;
      padding: 16px;
      z-index: 10000;
      border-radius: 12px;
      width: 240px;
      color: #fff;
    }

    #photo-mode-ui h3 {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 18px;
    }

    #photo-mode-ui label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: rgba(255,255,255,0.86);
    }

    #photo-mode-ui input[type="range"] {
      width: 100%;
      accent-color: #fff;
      cursor: pointer;
    }

    .control-group {
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: rgba(255,255,255,0.16);
    }

    .photo-toggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: auto;
      z-index: 9999;
      padding: 10px 14px;
    }

    .hint {
      position: fixed;
      left: 20px;
      bottom: 20px;
      color: rgba(255,255,255,0.52);
      font-size: 12px;
      z-index: 9999;
      user-select: none;
    }

    @media (max-width: 720px) {
      .capture-stage {
        transform: scale(0.55);
      }

      #photo-mode-ui {
        top: 20px;
        left: 20px;
        width: calc(100vw - 40px);
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section id="capture-stage" class="capture-stage">
      <div class="stars"></div>

      <div id="saturn">
        <div class="planet bottom planet-bg"></div>
        <div class="rings"></div>
        <div class="rings-shadow"></div>
        <div class="planet top planet-bg"></div>
      </div>
    </section>

    <button class="photo-toggle glass_panel" onclick="PhotoMode.toggle()">
      Modo Foto
    </button>

    <div class="hint">
      Atalho: pressione P para abrir ou fechar o Modo Foto.
    </div>

    <!-- Painel de Controle do Modo Foto -->
    <div id="photo-mode-ui" class="glass_panel">
      <h3>Modo Foto</h3>

      <div class="control-group">
        <label for="slider-rotation">Rotação:</label>
        <input type="range" id="slider-rotation" min="-180" max="180" value="-13">
      </div>

      <div class="control-group">
        <label for="slider-light-x">Luz X:</label>
        <input type="range" id="slider-light-x" min="0" max="100" value="32">
      </div>

      <div class="control-group">
        <label for="slider-light-y">Luz Y:</label>
        <input type="range" id="slider-light-y" min="0" max="100" value="32">
      </div>

      <div class="control-group">
        <label for="slider-contrast">Contraste:</label>
        <input type="range" id="slider-contrast" min="0.5" max="2" step="0.05" value="1.12">
      </div>

      <div class="control-group">
        <label for="slider-brightness">Brilho:</label>
        <input type="range" id="slider-brightness" min="0.25" max="1.2" step="0.01" value="0.58">
      </div>

      <button onclick="PhotoMode.takeScreenshot()">Capturar PNG</button>
      <button onclick="PhotoMode.toggle()" style="margin-top: 6px;">Fechar</button>
    </div>
  </main>

  <script>
    const PhotoMode = {
      state: {
        rotation: -13,
        lightX: 32,
        lightY: 32,
        contrast: 1.12,
        brightness: 0.58
      },

      toggle() {
        const ui = document.getElementById('photo-mode-ui');

        if (!ui) return;

        ui.style.display = ui.style.display === 'block' ? 'none' : 'block';
      },

      apply() {
        const root = document.documentElement;

        root.style.setProperty('--planet-rot', `${this.state.rotation}deg`);
        root.style.setProperty('--light-pos-x', `${this.state.lightX}%`);
        root.style.setProperty('--light-pos-y', `${this.state.lightY}%`);
        root.style.setProperty('--pm-contrast', this.state.contrast);
        root.style.setProperty('--pm-brightness', this.state.brightness);
      },

      bindSlider(id, key, formatter = Number) {
        const slider = document.getElementById(id);

        if (!slider) return;

        slider.addEventListener('input', (event) => {
          this.state[key] = formatter(event.target.value);
          this.apply();
        });
      },

      init() {
        this.bindSlider('slider-rotation', 'rotation', Number);
        this.bindSlider('slider-light-x', 'lightX', Number);
        this.bindSlider('slider-light-y', 'lightY', Number);
        this.bindSlider('slider-contrast', 'contrast', Number);
        this.bindSlider('slider-brightness', 'brightness', Number);

        this.apply();

        window.addEventListener('keydown', (event) => {
          if (event.key.toLowerCase() === 'p') {
            this.toggle();
          }
        });
      },

      async takeScreenshot() {
        const ui = document.getElementById('photo-mode-ui');
        const stage = document.getElementById('capture-stage');

        if (!stage) {
          alert('Elemento de captura não encontrado.');
          return;
        }

        const previousDisplay = ui ? ui.style.display : '';

        if (ui) {
          ui.style.display = 'none';
        }

        try {
          const canvas = await html2canvas(stage, {
            backgroundColor: '#000000',
            scale: 3,
            useCORS: true,
            allowTaint: true,
            logging: false,
            width: stage.offsetWidth,
            height: stage.offsetHeight
          });

          const link = document.createElement('a');
          link.download = 'Isomium_Capture.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (error) {
          console.error(error);
          alert('Não foi possível capturar a imagem.');
        } finally {
          if (ui) {
            ui.style.display = previousDisplay || 'block';
          }
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      PhotoMode.init();
    });
  </script>
</body>
</html>
